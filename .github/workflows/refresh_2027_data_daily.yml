name: Refresh 2027 Bart + Hoop Explorer (Daily)

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These two triggers cover EST/EDT; the gate below
    # allows only the trigger that is 8:05 AM in America/New_York.
    - cron: '5 12 * * *'
    - cron: '5 13 * * *'

concurrency:
  group: refresh-2027-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.local-time.outputs.run }}
    steps:
      - name: Allow only 8 AM Eastern run
        id: local-time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=America/New_York date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh-data:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh Bart 2027 datasets
        continue-on-error: true
        run: |
          python3 player_cards_pipeline/scripts/refresh_bart_2026_daily.py \
            --project-root . \
            --year 2027 \
            --history-start 2010

      - name: Refresh Hoop Explorer enriched players for script season 2027
        env:
          # The JSON ZIP contains shotInfo plus on/off/on_off/net_pts fields.
          # The aggregate CSV intentionally omits those richer player-board fields.
          HOOP_EXPLORER_EXPORT_URL: https://exports.hoop-explorer-extra.com/json/players_Men_2026.zip
        run: |
          python3 player_cards_pipeline/scripts/refresh_enriched_daily.py \
            --project-root . \
            --season 2027

      - name: Rebuild self-creation cache (2027)
        run: |
          python3 player_cards_pipeline/scripts/build_self_creation_cache.py \
            --project-root . \
            --years 2027

      - name: Recalculate statistical height (2027)
        continue-on-error: true
        run: |
          python3 player_cards_pipeline/scripts/train_height_profile_model.py \
            --project-root . \
            --bt-csv player_cards_pipeline/data/bt/bt_advstats_2010_2027.csv \
            --enriched-script-dir player_cards_pipeline/data/manual/enriched_players/by_script_season \
            --train-min-season 2019 \
            --train-max-season 2025 \
            --holdout-seasons 2025 \
            --score-season 2027 \
            --feature-set big \
            --out-model-json player_cards_pipeline/data/models/height_profile_model_v1.json \
            --out-score-csv player_cards_pipeline/output/height_profile_big_only_scores_2027.csv \
            --out-dependency-csv player_cards_pipeline/output/height_profile_feature_dependency.csv \
            --out-report-json player_cards_pipeline/output/height_profile_report_2027.json

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add player_cards_pipeline/data/bt/ || true
          git add player_cards_pipeline/data/manual/enriched_players/ || true
          git add player_cards_pipeline/data/bt/self_creation_by_year/ || true
          git add player_cards_pipeline/data/models/height_profile_model_v1.json || true
          git add player_cards_pipeline/output/height_profile_big_only_scores_2027.csv || true
          git add player_cards_pipeline/output/height_profile_feature_dependency.csv || true
          git add player_cards_pipeline/output/height_profile_report_2027.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh 2027 Bart and Hoop Explorer datasets"
          git pull --rebase origin main
          git push origin main
