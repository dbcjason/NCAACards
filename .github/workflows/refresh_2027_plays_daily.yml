name: Refresh 2027 Plays (Daily)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional YYYY-MM-DD; blank uses yesterday ET"
        required: false
        default: ""
  schedule:
    - cron: '30 10 * * *'

concurrency:
  group: refresh-2027-plays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append 2027 plays
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            EXTRA_ARGS="--date ${{ github.event.inputs.target_date }}"
          fi
          python3 player_cards_pipeline/scripts/refresh_2026_plays_daily_append.py \
            --project-root . \
            --season 2027 \
            ${EXTRA_ARGS}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cbbd_seasons/2026-2027/tables/ cbbd_seasons/2026-2027/manifest/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh 2027 plays datasets"
          git pull --rebase origin main
          git push origin main
