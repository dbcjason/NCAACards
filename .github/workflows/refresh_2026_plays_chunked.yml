name: Refresh 2026 Plays (Chunked)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose daily append (default) or full all-teams refresh."
        required: true
        default: daily_append
        type: choice
        options:
          - daily_append
          - all
      target_date:
        description: "Optional YYYY-MM-DD for daily append. Blank = yesterday (ET)."
        required: false
        default: ""
  schedule:
    # Runs daily at 10:30 UTC (around early-morning ET). Adjust as needed.
    - cron: '30 10 * * *'

concurrency:
  group: refresh-2026-plays-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-all:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'all' }}
    runs-on: ubuntu-latest
    outputs:
      team_total: ${{ steps.shards.outputs.team_total }}
      shard_matrix: ${{ steps.shards.outputs.shard_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build 2026 team list for plays pull
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          src = Path("player_cards_pipeline/data/bt/bt_advstats_2026.csv")
          out = Path("player_cards_pipeline/data/manual/plays_2026_teams.csv")
          teams = set()
          if src.exists():
              with src.open("r", encoding="utf-8-sig", newline="") as f:
                  rd = csv.DictReader(f)
                  for r in rd:
                      t = (r.get("team") or "").strip()
                      if t:
                          teams.add(t)
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("w", encoding="utf-8", newline="") as f:
              wr = csv.writer(f)
              wr.writerow(["team"])
              for t in sorted(teams):
                  wr.writerow([t])
          print(f"wrote {out} teams={len(teams)}")
          PY

      - name: Compute shard plan
        id: shards
        run: |
          python3 - <<'PY'
          import csv, json, os
          from pathlib import Path

          csv_path = Path("player_cards_pipeline/data/manual/plays_2026_teams.csv")
          chunk_size = 30
          with csv_path.open(newline="", encoding="utf-8") as f:
              rd = csv.DictReader(f)
              teams = [r.get("team", "").strip() for r in rd if r.get("team", "").strip()]

          total = len(teams)
          shards = []
          if total > 0:
              start = 1
              while start <= total:
                  end = min(start + chunk_size - 1, total)
                  shards.append(
                      {
                          "team_start": start,
                          "team_end": end,
                          "chunk_tag": f"chunk{start:03d}_{end:03d}",
                      }
                  )
                  start = end + 1

          out = Path("/tmp/shards.json")
          out.write_text(json.dumps(shards), encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh:
              gh.write(f"team_total={total}\n")
              gh.write(f"shard_matrix={json.dumps(shards)}\n")

          print(f"team_total={total}")
          print(f"shards={len(shards)}")
          PY

      - name: Upload team list artifact
        uses: actions/upload-artifact@v4
        with:
          name: plays-2026-team-list
          path: player_cards_pipeline/data/manual/plays_2026_teams.csv
          if-no-files-found: error

  run-all-shards:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'all' && fromJson(needs.prepare-all.outputs.team_total) > 0 }}
    needs: prepare-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJson(needs.prepare-all.outputs.shard_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download team list
        uses: actions/download-artifact@v4
        with:
          name: plays-2026-team-list
          path: player_cards_pipeline/data/manual

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull shard plays
        run: |
          python3 pull_cbbd_lineups_plays_only_chunked_tmp.py \
            --year 2026 \
            --teams-csv player_cards_pipeline/data/manual/plays_2026_teams.csv \
            --team-col team \
            --season-type both \
            --datasets plays \
            --team-start "${{ matrix.shard.team_start }}" \
            --team-end "${{ matrix.shard.team_end }}" \
            --chunk-tag "${{ matrix.shard.chunk_tag }}" \
            --max-csv-mb 95.0 \
            --max-requests 3000 \
            --sleep-sec 0.08

      - name: Upload shard table outputs
        uses: actions/upload-artifact@v4
        with:
          name: plays-2026-${{ matrix.shard.chunk_tag }}
          path: |
            cbbd_seasons/2025-2026/tables/*_${{ matrix.shard.chunk_tag }}*.csv
          if-no-files-found: error

  merge-all-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'all' && fromJson(needs.prepare-all.outputs.team_total) > 0 }}
    needs:
      - prepare-all
      - run-all-shards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download team list
        uses: actions/download-artifact@v4
        with:
          name: plays-2026-team-list
          path: player_cards_pipeline/data/manual

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plays-2026-chunk*
          path: /tmp/plays_chunks
          merge-multiple: true

      - name: Stage chunk files
        run: |
          mkdir -p cbbd_seasons/2025-2026/tables
          cp /tmp/plays_chunks/*.csv cbbd_seasons/2025-2026/tables/ || true
          ls -lah cbbd_seasons/2025-2026/tables | head -n 200

      - name: Merge chunks into canonical plays tables
        run: |
          python3 pull_cbbd_lineups_plays_only_chunked_tmp.py \
            --year 2026 \
            --season-type both \
            --datasets plays \
            --merge-only \
            --merge-chunks \
            --max-csv-mb 95.0

      - name: Commit and push merged outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cbbd_seasons/2025-2026/tables/ || true
          git add cbbd_seasons/2025-2026/manifest/ || true
          git add player_cards_pipeline/data/manual/plays_2026_teams.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh 2026 plays datasets (parallel all bootstrap)"
          git pull --rebase origin main
          git push origin main || (git pull --rebase origin main && git push origin main)

  daily-append-and-push:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'all') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull 2026 plays (daily append)
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            EXTRA_ARGS="--date ${{ github.event.inputs.target_date }}"
          fi
          python3 player_cards_pipeline/scripts/refresh_2026_plays_daily_append.py \
            --project-root "." \
            --season 2026 \
            ${EXTRA_ARGS}

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cbbd_seasons/2025-2026/tables/ || true
          git add cbbd_seasons/2025-2026/manifest/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh 2026 plays datasets (daily append)"
          git pull --rebase origin main
          git push origin main || (git pull --rebase origin main && git push origin main)
